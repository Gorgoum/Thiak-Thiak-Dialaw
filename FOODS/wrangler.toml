# Resto OUMY DJIAMIL sur Cloudflare Workers (plan gratuit)
# Projet séparé de Yobalema Yène : son propre Worker et sa propre base D1.
name = "resto-oumy-djiamil"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true
# Compte Cloudflare « Thiak Thiak Dialaw »
account_id = "076bb060c32e5b547c99815e36d127fa"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"   # garder les adresses exactes (/admin.html)

[[d1_databases]]
binding = "DB"
database_name = "resto-oumy-djiamil"
database_id = "f88955ec-4f30-403e-a285-29ae5cec9c1d"
migrations_dir = "migrations"

# Secrets (jamais dans ce fichier) : wrangler secret put ADMIN_MOT_DE_PASSE / JWT_SECRET

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Lamiral Food : même programme, son propre site et sa propre base
# Mise en ligne : wrangler deploy --env lamiral
# ---------------------------------------------------------------------------
[env.lamiral]
name = "resto-lamiral-food"
workers_dev = true

[env.lamiral.vars]
NOM_RESTO = "Lamiral Food"
CODE_YOBALEMA = "lamiral-food"
THEME = "ocean"

[env.lamiral.assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"

[[env.lamiral.d1_databases]]
binding = "DB"
database_name = "resto-lamiral-food"
database_id = "d9c2371c-3fa4-426f-aec2-505b9519a98c"
migrations_dir = "migrations"

[env.lamiral.observability]
enabled = true
